[package]
name = "zebot-shell"
version = "0.1.0"
description = "Cascarón de escritorio de Zebot: ventana transparente que carga la interfaz del servidor."
authors = ["Sebastian Avila"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[[bin]]
name = "zebot"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-single-instance = "2.5.2"
tauri-plugin-opener = "2.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }

[features]
# Without the Tauri CLI, `cargo build` must embed the frontend itself.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
