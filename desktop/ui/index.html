<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Zebot</title>
  <!-- Bundled loader: a sleeping Zebot while the server is unreachable.
       As soon as <server>/health answers, the window switches to <server>/?widget. -->
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    body { display: grid; place-items: end center; height: 100vh; font: 12px "JetBrains Mono", Consolas, monospace; }
    .stage { display: grid; justify-items: center; gap: 6px; padding: 8px; cursor: move; }
    .bubble {
      background: #0F1E2D; color: #8FA3B5; border: 1px solid #1C3346; border-radius: 12px;
      padding: 8px 12px; max-width: 260px; text-align: center; line-height: 1.4;
    }
    canvas { width: 128px; height: 128px; image-rendering: pixelated; image-rendering: crisp-edges; }
    .label { color: #8FA3B5; text-shadow: 0 0 3px #0B1622, 0 0 2px #0B1622; }
  </style>
</head>
<body>
  <div class="stage" data-tauri-drag-region>
    <div class="bubble" id="msg" data-tauri-drag-region>zzz… Buscando al servidor.</div>
    <canvas id="pet" width="32" height="32" data-tauri-drag-region></canvas>
    <div class="label" data-tauri-drag-region>Zebot · dormido</div>
  </div>
  <script type="module">
    import { drawZebot } from "./zebot-sprite.js";

    const server = window.ZEBOT_SERVER || "http://192.168.1.63:8000";
    const ctx = document.getElementById("pet").getContext("2d");
    const msg = document.getElementById("msg");
    const RETRY_MS = 30000;

    (function frame(t) { drawZebot(ctx, "dormido", t); requestAnimationFrame(frame); })(0);

    async function reachable() {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), 4000);
      try {
        // no-cors: the response is opaque, but it only resolves if the server answered.
        await fetch(`${server}/health`, { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
        return true;
      } catch {
        return false;
      } finally {
        clearTimeout(timer);
      }
    }

    async function check() {
      if (await reachable()) {
        location.replace(`${server}/?widget`);
        return;
      }
      msg.textContent = "zzz… El servidor no responde. Reintento en 30 s.";
      setTimeout(check, RETRY_MS);
    }
    check();
  </script>
</body>
</html>
