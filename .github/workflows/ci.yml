name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: backend
          load: true
          tags: zebot-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container against the fixture vault
        run: |
          docker run -d --name zebot -p 8000:8000 --read-only --tmpfs /tmp -v zebot-data:/data \
            -v "$PWD/backend/tests/fixtures/vault:/vault:ro" zebot-api:ci
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/health | grep '"vault_ok":true'
          curl -sf http://127.0.0.1:8000/tasks > /dev/null
          curl -sf http://127.0.0.1:8000/ | grep -q '<title>Zebot</title>'
          curl -sf http://127.0.0.1:8000/static/zebot-sprite.js > /dev/null
          curl -sf http://127.0.0.1:8000/briefing | grep '"source":"fallback"'
      - name: Container logs
        if: always()
        run: docker logs zebot || true

  desktop:
    name: Desktop shell (Windows)
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Loader sprite is in sync with the web UI
        shell: bash
        run: diff -u backend/app/static/zebot-sprite.js desktop/ui/zebot-sprite.js
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Unit tests (Inbox writer)
        working-directory: desktop/src-tauri
        run: cargo test --release
      - name: Build zebot.exe
        working-directory: desktop/src-tauri
        run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: zebot-windows-x64
          path: desktop/src-tauri/target/release/zebot.exe
          if-no-files-found: error
