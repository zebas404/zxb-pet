<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B1622">
  <meta name="description" content="Zebot: mascota virtual conectada a mi segundo cerebro.">
  <title>Zebot</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="app">
    <section class="stage" aria-label="Zebot">
      <div class="bubble" id="bubble" role="status" aria-live="polite">
        <div class="bubble-text" id="bubble-text">Iniciando…</div>
        <button class="icon-btn refresh" id="refresh" type="button" title="Regenerar el briefing (máx. 5 al día)" aria-label="Regenerar el briefing">↻</button>
      </div>
      <button class="pet-btn" id="pet-btn" type="button" aria-label="Tocar a Zebot">
        <canvas id="pet" width="32" height="32" role="img" aria-label="Zebot"></canvas>
      </button>
      <p class="mood-line"><span id="pet-name">Zebot</span> · <span id="mood">…</span><span class="badge" id="difficulty" hidden></span></p>
      <form class="capture" id="capture" autocomplete="off" hidden>
        <input id="capture-input" maxlength="120" placeholder="Ya hice…" aria-label="Cuéntale a Zebot qué hiciste" enterkeyhint="send">
      </form>
    </section>

    <section class="panel stats" aria-label="Estado">
      <div class="stat">
        <span class="label">Energía</span>
        <div class="bar"><div class="fill energy" id="energy-bar"></div></div>
        <span class="value" id="energy">–</span>
      </div>
      <div class="stat">
        <span class="label">Felicidad</span>
        <div class="bar"><div class="fill happy" id="happiness-bar"></div></div>
        <span class="value" id="happiness">–</span>
      </div>
      <div class="stat">
        <span class="label">Nivel <b id="level">1</b></span>
        <div class="bar"><div class="fill xp" id="xp-bar"></div></div>
        <span class="value" id="xp">–</span>
      </div>
      <div class="streak" id="streak-box">
        <span class="streak-num" id="streak">0</span>
        <span class="label">días de racha</span>
      </div>
    </section>

    <section class="panel" aria-labelledby="tasks-title">
      <h2 id="tasks-title">Pendientes <span class="count" id="tasks-count"></span></h2>
      <ul class="tasks" id="tasks"><li class="muted">Cargando…</li></ul>
    </section>

    <section class="panel" aria-labelledby="study-title">
      <h2 id="study-title">Estudio</h2>
      <div id="study"><p class="muted">Cargando…</p></div>
    </section>

    <footer class="footer">
      <span id="updated">–</span> · <a href="/docs">API</a> · <a href="https://github.com/zebas404/zxb-pet">GitHub</a>
    </footer>
  </main>
  <script type="module" src="/static/app.js"></script>
</body>
</html>
